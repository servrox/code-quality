name: Stage npm release

on:
  push:
    branches: [main]
    paths: [.release-please-manifest.json]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npm-release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.candidate.outputs.version }}
      stage: ${{ steps.candidate.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_APP: ${{ vars.RELEASE_PLEASE_APP_SLUG }}
        run: |
          set -euo pipefail
          version=$(jq -er '
            select(.name == "@servrox/code-quality" and .private != true
              and .publishConfig.access == "public"
              and .publishConfig.registry == "https://registry.npmjs.org/")
            | .version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
          ' package.json)
          test "$version" = "$(jq -er '.["."]' .release-please-manifest.json)"
          printf 'version=%s\nstage=false\n' "$version" >> "$GITHUB_OUTPUT"
          printf '### npm archive verification\n\n- Version: %s\n- Commit: %s\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            exit 0
          fi
          if [[ "$GITHUB_REPOSITORY" != servrox/code-quality || "$GITHUB_REF" != refs/heads/main || "$REF_PROTECTED" != true ]]; then
            echo '::error::Staging requires protected main on servrox/code-quality.'
            exit 1
          fi
          git cat-file -e "$BEFORE_SHA^{commit}"
          if ! git cat-file -e "$BEFORE_SHA:.release-please-manifest.json" 2>/dev/null; then
            test "$version" = "$(git show "$BEFORE_SHA:package.json" | jq -er .version)"
            echo 'Initializing the manifest for the existing release.'
            exit 0
          fi
          if [[ "$version" == "$(git show "$BEFORE_SHA:.release-please-manifest.json" | jq -er '.["."]')" ]]; then
            echo 'The release version did not change.'
            exit 0
          fi
          latest=$(curl -fsSL --max-time 15 'https://registry.npmjs.org/@servrox%2fcode-quality/latest' | jq -er .version)
          if [[ "$version" == "$latest" ]]; then
            echo 'This version is already on npm. Verifying the archive only.'
            exit 0
          fi
          : "${RELEASE_APP:?Configure the Release Please GitHub App slug.}"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -er --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg app "$RELEASE_APP" \
              -f scripts/release/merged-release-pr.jq | jq -er .number
          printf 'stage=true\n' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Pack and verify the release archive
        id: pack
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/npm-release"
          mkdir "$release_dir"
          npm pack --ignore-scripts --pack-destination "$release_dir"
          archives=("$release_dir"/*.tgz)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}"
          mv -- "${archives[0]}" "$release_dir/package.tgz"
          pnpm test:package "$release_dir/package.tgz"
          sha256=$(sha256sum "$release_dir/package.tgz" | cut -d ' ' -f 1)
          printf '%s  package.tgz\n' "$sha256" > "$release_dir/SHA256SUMS"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: npm-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error

  trusted-stage:
    needs: verify
    if: ${{ needs.verify.outputs.stage == 'true' && github.event_name == 'push' && github.repository == 'servrox/code-quality' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the verified version is still current on protected main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected) | .commit.sha')
          test "$(git rev-parse HEAD)" = "$main"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main"
          # A rebased release PR may end with a changelog-only follow-up commit.
          # Compare version transitions so reusing an abandoned version stays blocked.
          candidate_manifest_change=$(git log --first-parent -1 --format=%H "$GITHUB_SHA" -- .release-please-manifest.json)
          last_manifest_change=$(git log --first-parent -1 --format=%H "$main" -- .release-please-manifest.json)
          if [[ "$last_manifest_change" != "$candidate_manifest_change" ]]; then
            echo '::error::The verified candidate no longer sets the release version on main.'
            exit 1
          fi
          test "$(jq -er .version package.json)" = "$RELEASE_VERSION"
          test "$(jq -er '.["."]' .release-please-manifest.json)" = "$RELEASE_VERSION"
      - name: Stage with npm Trusted Publishing
        working-directory: ${{ runner.temp }}/npm-release
        env:
          PACKAGE_SHA256: ${{ needs.verify.outputs.sha256 }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s  package.tgz\n' "$PACKAGE_SHA256" | sha256sum --check --strict
          npm stage publish ./package.tgz --access public --json --ignore-scripts --fetch-retries=0 > "$RUNNER_TEMP/npm-stage.json"
          stage_id=$(jq -er '.["@servrox/code-quality"].stageId | strings | select(length > 0)' "$RUNNER_TEMP/npm-stage.json")
          printf '### npm stage\n\n- Version: %s\n- Stage ID: %s\n- Commit: %s\n- SHA-256: %s\n' \
            "$RELEASE_VERSION" "$stage_id" "$GITHUB_SHA" "$PACKAGE_SHA256" >> "$GITHUB_STEP_SUMMARY"
