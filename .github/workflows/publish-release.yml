name: Stage npm release
run-name: npm ${{ inputs.mode }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version
        required: true
        type: string
      mode:
        description: Verify an archive or submit it for maintainer approval on npm
        required: true
        type: choice
        default: verify
        options:
          - verify
          - bootstrap-stage
          - trusted-stage

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check staging eligibility
        if: ${{ inputs.mode != 'verify' }}
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != servrox/code-quality || "$GITHUB_REF" != refs/heads/main || "$REF_PROTECTED" != true ]]; then
            echo '::error::Staging requires protected main on servrox/code-quality.'
            exit 1
          fi
          if [[ "$RELEASE_MODE" == bootstrap-stage && "$RELEASE_VERSION" != 0.1.0 ]]; then
            echo '::error::Use trusted-stage for versions after 0.1.0.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check package identity and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          jq -e --arg version "$RELEASE_VERSION" '
            .name == "@servrox/code-quality" and .version == $version and
            .private != true and .publishConfig.access == "public"
          ' package.json >/dev/null
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Pack and verify the release archive
        id: pack
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/npm-release"
          mkdir "$release_dir"
          npm pack --ignore-scripts --pack-destination "$release_dir"
          archives=("$release_dir"/*.tgz)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}"
          mv -- "${archives[0]}" "$release_dir/package.tgz"
          pnpm test:package "$release_dir/package.tgz"
          sha256=$(sha256sum "$release_dir/package.tgz" | cut -d ' ' -f 1)
          printf '%s  package.tgz\n' "$sha256" > "$release_dir/SHA256SUMS"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: npm-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error

  bootstrap-stage:
    needs: verify
    if: ${{ inputs.mode == 'bootstrap-stage' && github.repository == 'servrox/code-quality' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-bootstrap
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Check protected main still points to the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected) | .commit.sha')
          test "$current" = "$GITHUB_SHA"
      - name: Stage 0.1.0 with the temporary npm token
        working-directory: ${{ runner.temp }}/npm-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?Set the NPM_BOOTSTRAP_TOKEN environment secret before staging.}"
          printf '%s  package.tgz\n' "$PACKAGE_SHA256" | sha256sum --check --strict
          npm stage publish ./package.tgz --access public --json --ignore-scripts --fetch-retries=0 > "$RUNNER_TEMP/npm-stage.json"
          stage_id=$(jq -er '.["@servrox/code-quality"].stageId | strings | select(length > 0)' "$RUNNER_TEMP/npm-stage.json")
          printf '### npm stage\n\n- Version: 0.1.0\n- Stage ID: %s\n- Commit: %s\n- SHA-256: %s\n' \
            "$stage_id" "$GITHUB_SHA" "$PACKAGE_SHA256" >> "$GITHUB_STEP_SUMMARY"

  trusted-stage:
    needs: verify
    if: ${{ inputs.mode == 'trusted-stage' && github.repository == 'servrox/code-quality' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Check protected main still points to the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected) | .commit.sha')
          test "$current" = "$GITHUB_SHA"
      - name: Stage with npm Trusted Publishing
        working-directory: ${{ runner.temp }}/npm-release
        env:
          PACKAGE_SHA256: ${{ needs.verify.outputs.sha256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s  package.tgz\n' "$PACKAGE_SHA256" | sha256sum --check --strict
          npm stage publish ./package.tgz --access public --json --ignore-scripts --fetch-retries=0 > "$RUNNER_TEMP/npm-stage.json"
          stage_id=$(jq -er '.["@servrox/code-quality"].stageId | strings | select(length > 0)' "$RUNNER_TEMP/npm-stage.json")
          printf '### npm stage\n\n- Version: %s\n- Stage ID: %s\n- Commit: %s\n- SHA-256: %s\n' \
            "$RELEASE_VERSION" "$stage_id" "$GITHUB_SHA" "$PACKAGE_SHA256" >> "$GITHUB_STEP_SUMMARY"
